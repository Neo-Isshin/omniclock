# Include inside the existing www.ailyre.com HTTPS server block.
# OmniClock and the legacy TokenClock URLs share the existing verified files.
# The exact pricing-catalog location remains in tokenclock-catalog.conf.
location /tokenclock/ {
    alias /var/www/tokenclock/;
    autoindex off;
    expires -1;
    types {
        application/json json;
        text/html html;
        text/plain sh ps1 sha256;
        application/gzip gz;
        application/zip zip;
    }
    default_type application/octet-stream;
}

location /omniclock/ {
    alias /var/www/tokenclock/;
    autoindex off;
    expires -1;
    types {
        application/json json;
        text/html html;
        text/plain sh ps1 sha256;
        application/gzip gz;
        application/zip zip;
    }
    default_type application/octet-stream;
}
