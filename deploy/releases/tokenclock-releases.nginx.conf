# Include inside the existing www.ailyre.com HTTPS server block.
# OmniClock and the legacy TokenClock URLs share the existing verified files.
# The exact pricing-catalog location remains in tokenclock-catalog.conf.
location /tokenclock/ {
    alias /var/www/tokenclock/;
    autoindex off;
    expires -1;
    types {
        application/json json;
        text/html html;
        text/plain sh ps1 sha256;
        application/gzip gz;
        application/zip zip;
    }
    default_type application/octet-stream;
}

location /omniclock/ {
    alias /var/www/tokenclock/;
    autoindex off;
    expires -1;
    types {
        application/json json;
        text/html html;
        text/plain sh ps1 sha256;
        application/gzip gz;
        application/zip zip;
    }
    default_type application/octet-stream;
}

# OmniClock release namespace; legacy clients receive the migration feed.
location = /omniclock/releases/latest.json {
    alias /var/www/tokenclock/releases/omniclock-latest.json;
    default_type application/json;
    expires -1;
}
location = /omniclock/releases/latest-windows.json {
    alias /var/www/tokenclock/releases/omniclock-latest-windows.json;
    default_type application/json;
    expires -1;
}
